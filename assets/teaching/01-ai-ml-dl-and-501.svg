<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">AI、机器学习、深度学习与第 501 个分子</title>
  <desc id="desc">左侧用嵌套圆表示深度学习属于机器学习、机器学习属于人工智能；右侧展示从分子表示到溶解度预测的监督学习流程。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#443f36" flood-opacity=".14"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#3f4854"/></marker>
    <style>
      .sans{font-family:"Noto Sans SC","Microsoft YaHei",Arial,sans-serif}.serif{font-family:"Noto Serif SC","STSong",serif}
      .ink{fill:#282c34}.muted{fill:#656a73}.small{font-size:18px}.label{font-size:22px;font-weight:700}.title{font-size:34px;font-weight:800}
    </style>
  </defs>
  <rect width="1200" height="675" rx="28" fill="#fbf7ef"/>
  <path d="M34 102C226 78 382 94 566 72M677 96C852 74 1006 82 1164 62" stroke="#e8ddc8" stroke-width="3" fill="none" stroke-linecap="round"/>
  <text x="54" y="64" class="sans title ink">先别从 ChatGPT 开始：我们要预测第 501 个分子</text>

  <g transform="translate(55 116)" filter="url(#shadow)">
    <rect width="480" height="490" rx="26" fill="#fffdf8" stroke="#d8cdbb" stroke-width="2"/>
    <text x="28" y="46" class="sans label ink">一张“够用”的关系图</text>
    <circle cx="236" cy="267" r="180" fill="#e5f0eb" stroke="#6f9d87" stroke-width="3"/>
    <circle cx="236" cy="282" r="125" fill="#e8edf8" stroke="#768cad" stroke-width="3"/>
    <circle cx="236" cy="301" r="67" fill="#f4dfda" stroke="#b67a70" stroke-width="3"/>
    <text x="236" y="130" text-anchor="middle" class="sans label ink">AI</text>
    <text x="236" y="155" text-anchor="middle" class="sans small muted">目标范围最大；不一定都靠“学习”</text>
    <text x="236" y="225" text-anchor="middle" class="sans label ink">Machine Learning</text>
    <text x="236" y="252" text-anchor="middle" class="sans small muted">从数据学可预测的关系</text>
    <text x="236" y="299" text-anchor="middle" class="sans label ink">Deep</text>
    <text x="236" y="325" text-anchor="middle" class="sans label ink">Learning</text>
    <text x="236" y="471" text-anchor="middle" class="sans small muted">这是一张入门地图，不是全部 AI 的法定分类表</text>
  </g>

  <g transform="translate(574 116)" filter="url(#shadow)">
    <rect width="570" height="490" rx="26" fill="#fffdf8" stroke="#d8cdbb" stroke-width="2"/>
    <text x="28" y="46" class="sans label ink">监督学习的最小闭环</text>
    <g class="sans">
      <rect x="34" y="88" width="142" height="86" rx="18" fill="#f8e9c9" stroke="#bf9855" stroke-width="2"/>
      <text x="105" y="122" text-anchor="middle" class="label ink">molecule</text><text x="105" y="149" text-anchor="middle" class="small muted">研究对象</text>
      <path d="M181 131H220" stroke="#3f4854" stroke-width="3" marker-end="url(#arrow)"/>
      <rect x="230" y="88" width="142" height="86" rx="18" fill="#e5f0eb" stroke="#6f9d87" stroke-width="2"/>
      <text x="301" y="122" text-anchor="middle" class="label ink">x</text><text x="301" y="149" text-anchor="middle" class="small muted">representation</text>
      <path d="M377 131H416" stroke="#3f4854" stroke-width="3" marker-end="url(#arrow)"/>
      <rect x="426" y="88" width="110" height="86" rx="18" fill="#e8edf8" stroke="#768cad" stroke-width="2"/>
      <text x="481" y="122" text-anchor="middle" class="label ink">model</text><text x="481" y="149" text-anchor="middle" class="small muted">f(x; θ)</text>

      <path d="M481 180V229" stroke="#3f4854" stroke-width="3" marker-end="url(#arrow)"/>
      <rect x="386" y="238" width="190" height="82" rx="18" fill="#f4dfda" stroke="#b67a70" stroke-width="2"/>
      <text x="481" y="272" text-anchor="middle" class="label ink">prediction ŷ</text><text x="481" y="299" text-anchor="middle" class="small muted">预测 logS</text>
      <rect x="34" y="238" width="190" height="82" rx="18" fill="#efe6f5" stroke="#9677a6" stroke-width="2"/>
      <text x="129" y="272" text-anchor="middle" class="label ink">target y</text><text x="129" y="299" text-anchor="middle" class="small muted">实验测得 logS</text>
      <path d="M481 326V350H338V371" stroke="#3f4854" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
      <path d="M129 326V350H264V371" stroke="#3f4854" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
      <rect x="206" y="379" width="190" height="70" rx="18" fill="#fff0d7" stroke="#c8893e" stroke-width="2"/>
      <text x="301" y="421" text-anchor="middle" class="label ink">loss：差多少？</text>
      <path d="M206 414H145V190H416" stroke="#b65f54" stroke-width="3" fill="none" stroke-dasharray="8 8" marker-end="url(#arrow)"/>
      <text x="34" y="470" class="small muted">虚线：用误差更新 θ；新分子只有 x，没有已知 y。</text>
    </g>
  </g>
  <text x="600" y="648" text-anchor="middle" class="serif small muted">一张图要能回答：机器看见什么、输出什么、拿什么判断自己错了。</text>
</svg>
